<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#09090b"/>
  <!-- 复 - Abstract: two horizontal strokes + vertical stem = layered composite structure -->
  <rect x="128" y="136" width="256" height="28" rx="4" fill="#fafafa"/>
  <rect x="128" y="204" width="256" height="28" rx="4" fill="#fafafa" opacity="0.6"/>
  <!-- 材 - Abstract: vertical fiber + diagonal cross = reinforcement fiber -->
  <rect x="242" y="272" width="28" height="168" rx="4" fill="#fafafa"/>
  <line x1="164" y1="316" x2="348" y2="400" stroke="#fafafa" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
  <line x1="348" y1="316" x2="164" y2="400" stroke="#fafafa" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
</svg>
