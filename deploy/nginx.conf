# Nginx 反代配置 — f1frp.com 国内侧 (阿里云 ECS)
# 部署位置: /etc/nginx/conf.d/f1frp.conf
# 备案下号前: server_name 用 _; 监听 8080 内部测试
# 备案下号后: 取消注释 SSL 块，server_name 改 f1frp.com www.f1frp.com

upstream f1frp_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Gzip 压缩 proxied 响应 — /formulas 是 2.7 MB 重 HTML (115 个配方全量 SSR),
# 不压缩走 3 Mbps ECS 出口要 7s+，中国移动端易超时显示 "This page couldn't load"
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf;
# text/html 默认就压缩，不用写

# ─── HTTP (备案前用 80 测试或临时跑；备案后跳 HTTPS) ───
server {
    listen 80;
    listen [::]:80;
    server_name f1frp.com www.f1frp.com;

    # 备案下号后取消注释，强制 HTTPS
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://f1frp_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Next.js 静态资源缓存
    location /_next/static/ {
        proxy_pass http://f1frp_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

